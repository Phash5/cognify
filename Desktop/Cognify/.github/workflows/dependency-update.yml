name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        directory: ['client', 'server', '.']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Update dependencies in ${{ matrix.directory }}
      run: |
        cd ${{ matrix.directory }}
        npm update
        npm audit fix --force
    
    - name: Run tests after update
      run: |
        if [ "${{ matrix.directory }}" = "client" ]; then
          cd client && npm test -- --watchAll=false
        elif [ "${{ matrix.directory }}" = "server" ]; then
          cd server && npm test
        fi
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore(${{ matrix.directory }}): update dependencies'
        title: 'chore(${{ matrix.directory }}): automated dependency updates'
        body: |
          ## Automated Dependency Updates
          
          This PR contains automated dependency updates for the `${{ matrix.directory }}` directory.
          
          ### Changes
          - Updated npm dependencies to latest compatible versions
          - Applied security fixes via `npm audit fix`
          
          ### Testing
          - ✅ All tests pass after dependency updates
          - ✅ Security vulnerabilities addressed
          
          **Note**: This PR was created automatically. Please review the changes before merging.
        branch: dependency-updates/${{ matrix.directory }}
        delete-branch: true

  security-scan:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd client && npm ci
        cd ../server && npm ci
    
    - name: Run comprehensive security audit
      run: |
        echo "## Security Audit Report" > security-report.md
        echo "Generated on: $(date)" >> security-report.md
        echo "" >> security-report.md
        
        echo "### Root Dependencies" >> security-report.md
        npm audit --json | jq -r '.vulnerabilities | to_entries[] | "- \(.key): \(.value.severity)"' >> security-report.md || echo "No vulnerabilities found" >> security-report.md
        echo "" >> security-report.md
        
        echo "### Client Dependencies" >> security-report.md
        cd client
        npm audit --json | jq -r '.vulnerabilities | to_entries[] | "- \(.key): \(.value.severity)"' >> ../security-report.md || echo "No vulnerabilities found" >> ../security-report.md
        cd ..
        echo "" >> security-report.md
        
        echo "### Server Dependencies" >> security-report.md
        cd server
        npm audit --json | jq -r '.vulnerabilities | to_entries[] | "- \(.key): \(.value.severity)"' >> ../security-report.md || echo "No vulnerabilities found" >> ../security-report.md
        cd ..
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
        retention-days: 30
    
    - name: Create security issue if vulnerabilities found
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('security-report.md', 'utf8');
          
          if (report.includes('severity')) {
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Weekly Security Scan - Vulnerabilities Found',
              body: `## Security Vulnerabilities Detected\n\n${report}\n\n**Action Required**: Please review and address these security vulnerabilities.`,
              labels: ['security', 'bug', 'high-priority']
            });
          }