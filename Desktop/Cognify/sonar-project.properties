# SonarCloud Configuration
sonar.projectKey=cognify-ai-platform
sonar.organization=cognify-team
sonar.projectName=Cognify AI Platform
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=client/src,server
sonar.tests=client/src/__tests__,server/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.js,**/*.spec.js

# Language-specific settings
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
sonar.typescript.lcov.reportPaths=client/coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/setupTests.js,**/jest.config.js,**/babel.config.js,**/tailwind.config.js,**/vite.config.js

# Duplication exclusions
sonar.cpd.exclusions=**/*.test.js,**/*.spec.js

# Quality gate
sonar.qualitygate.wait=true

# Branch analysis
sonar.branch.name=${GITHUB_REF_NAME}
sonar.pullrequest.key=${GITHUB_PR_NUMBER}
sonar.pullrequest.branch=${GITHUB_HEAD_REF}
sonar.pullrequest.base=${GITHUB_BASE_REF}