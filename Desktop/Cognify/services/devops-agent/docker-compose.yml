version: '3.8'

services:
  # Redis service for caching
  redis:
    image: redis:7-alpine
    container_name: devops-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - devops-network
    environment:
      - REDIS_REPLICATION_MODE=master
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # DevOps AI Agent service
  devops-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: devops-agent-app
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      # Server Configuration
      - NODE_ENV=development
      - PORT=3003
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_KEY_PREFIX=devops-agent:
      - REDIS_CONNECT_TIMEOUT=10000
      - REDIS_COMMAND_TIMEOUT=5000
      - REDIS_RETRY_ATTEMPTS=3
      - REDIS_RETRY_DELAY=1000
      
      # Cache Configuration
      - CACHE_TTL=3600
      - CACHE_MAX_SIZE=1000
      - CACHE_CHECK_PERIOD=600
      
      # OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4
      - OPENAI_MAX_TOKENS=4000
      - OPENAI_TEMPERATURE=0.1
      - OPENAI_TIMEOUT=30000
      - OPENAI_MAX_RETRIES=3
      
      # Authentication
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key-change-in-production}
      - JWT_EXPIRES_IN=24h
      - API_KEYS=${API_KEYS:-dev-api-key-1,dev-api-key-2}
      
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - RATE_LIMIT_AI_WINDOW_MS=3600000
      - RATE_LIMIT_AI_MAX_REQUESTS=50
      - RATE_LIMIT_DEPLOYMENT_WINDOW_MS=3600000
      - RATE_LIMIT_DEPLOYMENT_MAX_REQUESTS=20
      - RATE_LIMIT_INFRASTRUCTURE_WINDOW_MS=3600000
      - RATE_LIMIT_INFRASTRUCTURE_MAX_REQUESTS=15
      - RATE_LIMIT_MONITORING_WINDOW_MS=3600000
      - RATE_LIMIT_MONITORING_MAX_REQUESTS=25
      - RATE_LIMIT_CONFIGURATION_WINDOW_MS=3600000
      - RATE_LIMIT_CONFIGURATION_MAX_REQUESTS=30
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_COLORIZE=false
      - LOG_TIMESTAMP=true
      - LOG_FILE_ENABLED=true
      - LOG_FILE_LEVEL=info
      - LOG_FILE_MAX_SIZE=10485760
      - LOG_FILE_MAX_FILES=5
      - LOG_FILE_DATE_PATTERN=YYYY-MM-DD
      
      # Task Management
      - TASK_TIMEOUT=300000
      - TASK_MAX_RETRIES=3
      - TASK_CLEANUP_INTERVAL=3600000
      - TASK_MAX_HISTORY=1000
      
      # DevOps Configuration
      - DEVOPS_SUPPORTED_PLATFORMS=kubernetes,docker,aws,azure,gcp,heroku,vercel
      - DEVOPS_DEPLOYMENT_TIMEOUT=600000
      - DEVOPS_INFRASTRUCTURE_TIMEOUT=900000
      - DEVOPS_MONITORING_TIMEOUT=300000
      - DEVOPS_CONFIGURATION_TIMEOUT=300000
      
      # Security
      - SECURITY_HELMET_ENABLED=true
      - SECURITY_CORS_ENABLED=true
      - SECURITY_RATE_LIMIT_ENABLED=true
      - SECURITY_INPUT_VALIDATION_ENABLED=true
      
      # Telemetry
      - TELEMETRY_ENABLED=true
      - TELEMETRY_SERVICE_NAME=devops-agent
      - TELEMETRY_SERVICE_VERSION=1.0.0
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=9090
      
      # Health Checks
      - HEALTH_CHECK_ENABLED=true
      - HEALTH_CHECK_INTERVAL=30000
      - HEALTH_CHECK_TIMEOUT=5000
      
      # Development
      - DEV_ENABLE_DEBUG_ROUTES=true
      - DEV_MOCK_AI_RESPONSES=false
      - DEV_ENABLE_REQUEST_LOGGING=true
    
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    
    depends_on:
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - devops-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Jaeger for distributed tracing (optional)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: devops-agent-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - devops-network
    profiles:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: devops-agent-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - devops-network
    profiles:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana for metrics visualization (optional)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: devops-agent-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - devops-network
    profiles:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Commander for Redis management (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: devops-agent-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - devops-network
    profiles:
      - tools
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  devops-network:
    driver: bridge
    name: devops-agent-network

volumes:
  redis_data:
    name: devops-agent-redis-data
  prometheus_data:
    name: devops-agent-prometheus-data
  grafana_data:
    name: devops-agent-grafana-data